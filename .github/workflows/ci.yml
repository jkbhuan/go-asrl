name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      ASRL_REQUIRE_NATIVE_IO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -v ./... -count=1 -timeout=120s
      - run: go vet ./...
      - run: go test -race ./... -count=1 -timeout=120s
        if: runner.os == 'Linux'

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: windows, arch: amd64}
          - {os: linux, arch: amd64}
          - {os: darwin, arch: arm64}
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go build ./...
